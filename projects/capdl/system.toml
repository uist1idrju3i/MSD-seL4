# SPDX-License-Identifier: BSD-3-Clause
version = 1
# PL011 is available only under the printing-off ownership policy.
kernel_printing = false

[[objects]]
name = "uart"
type = "device"
paddr = 0x3f201000
size = 4096
dma_capable = false
reason = "printing 無効の構成で、PL011 の polling だけを行う"

[[objects]]
name = "serial_ep"
type = "endpoint"
reason = "client から serial への一方向送信"

[[pds]]
name = "serial"
elf = "serial.elf"
stack = { vaddr = 0x70000000, size = 8192 }
ipc_buffer = 0x70002000
priority = 100
reason = "PL011 を polling する受信部品。データの長さを検査する"

[[pds.grants]]
name = "uart"
slot = 1
object = "uart"
type = "device"
rights = ["read", "write"]
vaddr = 0x40000000
reason = "PL011 の status 読み取りと送信 register 書き込み"

[[pds.grants]]
name = "receive"
slot = 2
object = "serial_ep"
type = "endpoint"
rights = ["read"]
reason = "client からの IPC の受信だけを許す"

[[pds]]
name = "client"
elf = "client.elf"
stack = { vaddr = 0x70000000, size = 8192 }
ipc_buffer = 0x70002000
priority = 90
reason = "短いメッセージを serial に送る。device と受信権限は持たない"

[[pds.grants]]
name = "send"
slot = 1
object = "serial_ep"
type = "endpoint"
rights = ["write"]
badge = 1
reason = "badge 1 で識別される送信。capability の転送は許さない"
