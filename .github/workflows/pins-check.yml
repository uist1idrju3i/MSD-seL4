name: 固定版の更新確認

on:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 固定版を上流と比べる
        id: pins
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/pins.md"
          python3 .github/scripts/check-pins.py upstream --report "$report"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"

      - name: Issue で知らせる
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS_ACTION: ${{ steps.pins.outputs.needs-action }}
        run: |
          set -euo pipefail
          title="固定版の更新確認"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          issue="$(gh issue list --state open --search "in:title $title" --json number,title --limit 100 |
            jq -r --arg title "$title" '.[] | select(.title == $title) | .number' | head -n1)"
          if [ "$NEEDS_ACTION" = true ]; then
            body="$(cat "$RUNNER_TEMP/pins.md")

          更新するときは vendor-update スキルの手順に従います。実行: $run_url"
            if [ -n "$issue" ]; then
              gh issue edit "$issue" --body "$body"
            else
              gh issue create --title "$title" --body "$body"
            fi
          elif [ -n "$issue" ]; then
            gh issue comment "$issue" --body "すべての固定版が最新です。$run_url"
            gh issue close "$issue"
          fi
