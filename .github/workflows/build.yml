name: Build

# The changes job skips the other jobs when no input of this workflow changed
# (for example research-only PRs); the result job gives one stable check.
on:
  push:
    branches:
      - main
  pull_request:
  # Weekly run keeps the image CVE scan and QEMU smoke test current.
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TRIVY_VERSION: "0.76.2"
  TRIVY_DIGEST: "sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb"

jobs:
  changes:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.check.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Check whether the inputs of this workflow changed
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 .github/scripts/changed-files.py
          '.github/workflows/build.yml' '.gitmodules' 'vendor/**' 'docker/**' 'tools/**' 'projects/**' 'patches/**' 'tests/msd-sel4-dev/**' 'tests/capdl/**'

  kernel-verified:
    name: kernel-verified
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: true

      - name: Check shallow submodules
        run: |
          python3 - <<'PY'
          import configparser
          parser = configparser.ConfigParser()
          parser.read(".gitmodules")
          bad = [s for s in parser.sections() if parser[s].get("shallow") != "true"]
          if not parser.sections() or bad:
              raise SystemExit(f"submodules without shallow = true: {bad}")
          PY

      - name: Prepare development image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf 'Published image for these inputs: %s\n' "$(docker/msd-sel4-dev available)" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          docker/msd-sel4-dev ensure

      - name: Check development image for other host UIDs
        run: tests/msd-sel4-dev/run.sh

      - name: Check generated capDL and capability mutations
        run: >-
          docker/msd-sel4-dev env MSD_CAPDL_PARSER_TESTS=1
          python3 -m unittest discover -s tests/capdl -k Parser -v

      - name: Build seL4 kernel (ARM_bcm2837_verified)
        run: |
          set -euo pipefail
          mkdir -p build
          docker/msd-sel4-dev tools/build-verified-kernel.sh | tee "$RUNNER_TEMP/kernel-verified.log"

      - name: Boot smoke root task on QEMU raspi3b (QEMU only)
        run: |
          set -euo pipefail
          docker/msd-sel4-dev tools/qemu-smoke.sh | tee "$RUNNER_TEMP/qemu-smoke.log"

      - name: Boot Rust smoke root task on QEMU raspi3b (QEMU only)
        run: |
          set -euo pipefail
          docker/msd-sel4-dev bash -euc '
            projects/rust-smoke/build.sh build/smoke
            MSD_SMOKE_ROOTSERVER=projects/rust-smoke/target/armv7a-sel4-roottask/release/rust-smoke.elf \
              MSD_SMOKE_MARKER="MSD-seL4 rust smoke: OK" tools/qemu-smoke.sh build/rust-smoke
          ' | tee "$RUNNER_TEMP/qemu-rust-smoke.log"

      - name: Record tool versions
        run: |
          set -euo pipefail
          docker/msd-sel4-dev bash -c 'arm-linux-gnueabi-gcc --version | head -1; cmake --version | head -1; ninja --version; qemu-system-arm --version | head -1; rustc --version' \
            | tee "$RUNNER_TEMP/tool-versions.txt"

      - name: Boot capDL request and isolated client fault (QEMU only)
        run: |
          set -euo pipefail
          docker/msd-sel4-dev tools/qemu-capdl.sh build/capdl-positive positive ci-positive
          docker/msd-sel4-dev tools/qemu-capdl.sh build/capdl-negative negative ci-negative

      - name: Restore Trivy database
        id: trivy-date
        run: printf 'date=%s\n' "$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/trivy-cache
          key: trivy-db-${{ env.TRIVY_VERSION }}-${{ steps.trivy-date.outputs.date }}
          restore-keys: trivy-db-${{ env.TRIVY_VERSION }}-

      - name: Scan development image
        env:
          TRIVY_IMAGE: ghcr.io/aquasecurity/trivy
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/trivy-cache"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --group-add "$(stat -c '%g' /var/run/docker.sock)" \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$RUNNER_TEMP/trivy-cache:/cache" \
            "${TRIVY_IMAGE}:${TRIVY_VERSION}@${TRIVY_DIGEST}" \
            --cache-dir /cache \
            image --scanners vuln --ignore-unfixed --severity CRITICAL \
            --exit-code 1 --no-progress msd-sel4-dev:local

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kernel-verified
          path: |
            build/kernel-verified/kernel.elf
            build/kernel-verified/CMakeCache.txt
            build/kernel-verified-sel4-src/MSD_SEL4_PATCHES
            build/smoke/pl011.log
            ${{ runner.temp }}/qemu-smoke.log
            build/rust-smoke/pl011.log
            build/capdl-positive/runs/
            build/capdl-negative/runs/
            build/capdl-positive/binaries.sha256
            build/capdl-negative/binaries.sha256
            ${{ runner.temp }}/qemu-rust-smoke.log
            ${{ runner.temp }}/kernel-verified.log
            ${{ runner.temp }}/tool-versions.txt
          if-no-files-found: error

  publish-dev-image:
    name: publish-dev-image
    needs: [changes, kernel-verified]
    if: needs.changes.outputs.relevant == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Build and push development image
        id: push
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repository=ghcr.io/uist1idrju3i/msd-sel4-dev
          tag="$(docker/msd-sel4-dev tag)"
          if MSD_SEL4_DEV_REQUIRE_ATTESTATION=1 docker/msd-sel4-dev pull; then
            printf 'skipped=true\n' >> "$GITHUB_OUTPUT"
            printf '%s:%s is already published with provenance.\n' "$repository" "$tag" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          printf 'skipped=false\n' >> "$GITHUB_OUTPUT"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
          MSD_SEL4_DEV_IMAGE="${repository}:${tag}" docker/msd-sel4-dev build
          docker tag "${repository}:${tag}" "${repository}:latest"
          docker push "${repository}:${tag}"
          docker push "${repository}:latest"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "${repository}:${tag}")"
          digest="${digest##*@}"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            printf 'Could not determine the pushed digest: %s\n' "$digest" >&2
            exit 1
          fi
          printf 'repository=%s\ndigest=%s\n' "$repository" "$digest" >> "$GITHUB_OUTPUT"
          printf 'Published %s:%s (%s)\n' "$repository" "$tag" "$digest" >> "$GITHUB_STEP_SUMMARY"

      # CI and docker/msd-sel4-dev pull verify this before using the image.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: steps.push.outputs.skipped == 'false'
        with:
          subject-name: ${{ steps.push.outputs.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io

  build-result:
    name: build-result
    if: always()
    needs: [changes, kernel-verified, publish-dev-image]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          printf 'results: %s\n' "$RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) exit 1 ;;
            esac
          done
